name: .NET CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Hanys.sln

      - name: Build
        run: dotnet build Hanys.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Hanys.sln --configuration Release --no-build --verbosity normal
